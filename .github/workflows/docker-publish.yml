name: Build and Push Docker Images to Docker Hub

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        include:
          - service: api-gateway
            image_name: api-gateway
            context: ./api-gateway
          - service: auth-service
            image_name: auth-service
            context: ./auth-service
          - service: provider-service
            image_name: provider-service
            context: ./provider-service
          - service: email-service
            image_name: email-service
            context: ./email-service
          - service: config-server
            image_name: config-server
            context: ./config-server
          - service: discovery-server
            image_name: discovery-server
            context: ./discovery-server
          - service: frontend-service
            image_name: frontend-service
            context: ./frontend-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ github.sha }}