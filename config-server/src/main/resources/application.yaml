spring:
  application:
    name: ConfigServer
  profiles:
    active: native
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
    config:
      server:
        native:
          search-locations: classpath:/config-repo

server:
  port: 8888
management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh
  metrics:
    tags:
      application: ${spring.application.name}