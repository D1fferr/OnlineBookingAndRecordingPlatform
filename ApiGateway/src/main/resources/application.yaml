spring:
  application:
    name: ApiGateway
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
  profiles:
    active: local
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true