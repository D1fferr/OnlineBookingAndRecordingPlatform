<h2 mat-dialog-title class="danger-title">⚠️ Delete Account</h2>

<mat-dialog-content [formGroup]="form" class="dialog-content">
  <p class="warning-text">
    This action <strong>CANNOT</strong> be undone. All your services, appointments, and settings will be permanently removed.
  </p>
  <p>Please type <strong>DELETE</strong> to confirm:</p>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Confirmation</mat-label>
    <input matInput formControlName="confirmText" placeholder="DELETE" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button class="delete-btn" [disabled]="form.invalid" (click)="onConfirm()">Delete Permanently</button>
</mat-dialog-actions>
