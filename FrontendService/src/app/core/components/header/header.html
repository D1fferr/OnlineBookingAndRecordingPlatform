<mat-toolbar color="primary" class="header-toolbar">
  <span class="logo" routerLink="/">BookingService</span>
  <span class="spacer"></span>

  @if (authService.isAuthenticated()) {
    <nav class="nav-links">
      <a mat-button routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a>
      <a mat-button routerLink="/appointments" routerLinkActive="active-link">Appointments</a>
      <a mat-button routerLink="/services" routerLinkActive="active-link">Services</a>
      <a mat-button routerLink="/working-hours" routerLinkActive="active-link">Working Hours</a>
      <a mat-button routerLink="/profile" routerLinkActive="active-link">Profile</a>
    </nav>

    <button mat-icon-button (click)="onLogout()" title="Logout" class="logout-btn">
      <mat-icon>exit_to_app</mat-icon>
    </button>
  } @else {
    <button mat-raised-button class="login-btn" routerLink="/login">Sign In</button>
  }
</mat-toolbar>
