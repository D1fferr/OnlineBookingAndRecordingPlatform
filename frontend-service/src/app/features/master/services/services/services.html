<div class="services-container">
  <div class="page-header">
    <div>
      <h2>Services Management</h2>
      <p>Manage your service catalog, prices, and durations.</p>
    </div>
    <button mat-raised-button class="add-btn" (click)="openAddDialog()">
      <mat-icon>add</mat-icon> Add New Service
    </button>
  </div>

  <div class="table-card">
    <table mat-table [dataSource]="services()" class="services-table">

      <!-- Service Name -->
      <ng-container matColumnDef="serviceName">
        <th mat-header-cell *matHeaderCellDef> Service Name </th>
        <td mat-cell *matCellDef="let element" class="name-cell"> {{ element.serviceName }} </td>
      </ng-container>

      <!-- Duration -->
      <ng-container matColumnDef="duration">
        <th mat-header-cell *matHeaderCellDef> Duration </th>
        <td mat-cell *matCellDef="let element"> {{ element.duration }} min </td>
      </ng-container>

      <!-- Price -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> Price </th>
        <td mat-cell *matCellDef="let element" class="price-cell"> {{ element.price | currency:'USD' }} </td>
      </ng-container>

      <!-- Description -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description </th>
        <td mat-cell *matCellDef="let element" class="description-cell"> {{ element.description }} </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header"> Actions </th>
        <td mat-cell *matCellDef="let element" class="actions-cell">
          <button mat-icon-button class="action-btn edit" (click)="openEditDialog(element)" title="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button class="action-btn delete" (click)="deleteService(element.id)" title="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [length]="totalElements()"
      [pageSize]="servicePerPage()"
      [pageSizeOptions]="[4, 8, 16]"
      (page)="onPageChange($event)"
      aria-label="Select page of services">
    </mat-paginator>
  </div>
</div>
